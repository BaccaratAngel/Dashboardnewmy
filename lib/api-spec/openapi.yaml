openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Baccarat prediction dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: game
    description: Game session (per-user engine state)
  - name: admin
    description: Admin account management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials or account expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Game ──────────────────────────────────────────────────
  /game/snapshot:
    get:
      operationId: getSnapshot
      tags: [game]
      summary: Get current prediction snapshot for this user's session
      responses:
        "200":
          description: Current engine snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/input:
    post:
      operationId: submitInput
      tags: [game]
      summary: Submit a game result (B, P, or T)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInputData"
      responses:
        "200":
          description: Updated snapshot after input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/undo:
    post:
      operationId: undoInput
      tags: [game]
      summary: Undo last hand
      responses:
        "200":
          description: Snapshot after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/reset:
    post:
      operationId: resetGame
      tags: [game]
      summary: Reset the shoe (clear all history)
      responses:
        "200":
          description: Fresh snapshot after reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/window:
    post:
      operationId: setWindow
      tags: [game]
      summary: Set the regime tracker rolling window (8, 12, or 16)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WindowSetting"
      responses:
        "200":
          description: Updated snapshot with new window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
        "400":
          description: Invalid window value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin ─────────────────────────────────────────────────
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with separate admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Admin authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out admin session
      responses:
        "204":
          description: Logged out

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all user accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          description: Invalid input or username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update account (change expiry, password, or username)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/kick:
    post:
      operationId: kickUserSession
      tags: [admin]
      summary: Revoke active session (force logout) for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session revoked
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth schemas ────────────────────────────────────────
    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    SessionUser:
      type: object
      required: [id, username, expiresAt]
      properties:
        id:
          type: integer
        username:
          type: string
        expiresAt:
          type: string
          description: ISO 8601 datetime when account expires

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1

    AdminSession:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ── Game schemas ────────────────────────────────────────
    GameInputData:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: "B, P, or T"

    WindowSetting:
      type: object
      required: [window]
      properties:
        window:
          type: integer
          description: "Rolling window: 8, 12, or 16"

    # Per-expert stats (Option C composite scoring)
    ExpertStats:
      type: object
      required: [predCount, wwr, rawWr, compositeScore, momentum, streak, hotStreak, sparkline, wwrDelta, lastPred, avgWinRun, avgLossRun, currentRunLen, currentRunIsWin]
      properties:
        predCount:
          type: integer
        wwr:
          type: number
          description: Bayesian-adjusted weighted win rate (0-1)
        rawWr:
          type: number
          description: Raw win rate (0-1)
        compositeScore:
          type: number
          description: Option C composite score (Bayesian + momentum + streak bonus)
        momentum:
          type: string
          description: '"up" | "down" | "flat" — trend over last 4 wwr values'
        streak:
          type: integer
          description: Current consecutive correct picks
        hotStreak:
          type: boolean
          description: streak >= 4
        sparkline:
          type: array
          items:
            type: number
          description: "Last 8 outcomes: 1=hit, 0=miss"
        wwrDelta:
          type: number
          description: Change in wwr since last hand
        lastPred:
          type: ["string", "null"]
          description: '"P", "B", or null'
        avgWinRun:
          type: number
          description: Average consecutive-win run length from history
        avgLossRun:
          type: number
          description: Average consecutive-loss run length from history
        currentRunLen:
          type: integer
          description: Length of the current ongoing win/loss run
        currentRunIsWin:
          type: ["boolean", "null"]
          description: true=winning run, false=losing run, null=no data

    TimelineEntry:
      type: object
      required: [expert, hands]
      properties:
        expert:
          type: string
        hands:
          type: integer

    RegimeState:
      type: object
      required:
        - status
        - decision
        - expert
        - confidence
        - isSplit
        - gap
        - bothAgree
        - agreeCount
        - regimeAge
        - switchCount
        - justSwitched
        - isLocked
        - lockRemain
        - lockMax
        - window
        - volatilityIndex
        - supreme
        - syndicate
        - lookAhead
        - legacyLookAhead
        - metaAI
        - observer
        - bebRoad
        - smallRoad
        - cockroachRoad
        - dualAuth
        - ensembleVerdict
        - ensemblePercent
        - switchTimeline
        - shadowLeader
        - shadowLeaderPred
        - shadowLeaderComposite
        - lockAccelerated
        - shadowPromoted
      properties:
        status:
          type: string
          description: "WARMING_UP | TRACKING | SPLIT"
        decision:
          type: ["string", "null"]
          description: "B | P | null (wait)"
        expert:
          type: ["string", "null"]
          description: "Dominant expert key, or null"
        confidence:
          type: string
          description: "NONE | LOW | MED | HIGH"
        isSplit:
          type: boolean
        gap:
          type: number
          description: Composite score gap between top two experts
        bothAgree:
          type: boolean
        bothAgreeSide:
          type: ["string", "null"]
        agreeCount:
          type: integer
          description: Number of experts agreeing with ensembleVerdict
        regimeAge:
          type: integer
        switchCount:
          type: integer
        justSwitched:
          type: boolean
        isLocked:
          type: boolean
        lockRemain:
          type: integer
        lockMax:
          type: integer
          description: Max lock hands (for progress bar)
        window:
          type: integer
        volatilityIndex:
          type: number
          description: 0-1 shoe volatility index (drives dynamic window)
        supreme:
          $ref: "#/components/schemas/ExpertStats"
        syndicate:
          $ref: "#/components/schemas/ExpertStats"
        lookAhead:
          $ref: "#/components/schemas/ExpertStats"
        legacyLookAhead:
          $ref: "#/components/schemas/ExpertStats"
        metaAI:
          $ref: "#/components/schemas/ExpertStats"
        observer:
          $ref: "#/components/schemas/ExpertStats"
        bebRoad:
          $ref: "#/components/schemas/ExpertStats"
        smallRoad:
          $ref: "#/components/schemas/ExpertStats"
        cockroachRoad:
          $ref: "#/components/schemas/ExpertStats"
        dualAuth:
          $ref: "#/components/schemas/ExpertStats"
        ensembleVerdict:
          type: ["string", "null"]
          description: Ensemble-blended verdict (P, B, or null)
        ensemblePercent:
          type: integer
          description: 0-100 lean strength toward ensembleVerdict
        switchTimeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        shadowLeader:
          type: ["string", "null"]
          description: Best non-locked expert during a lock window
        shadowLeaderPred:
          type: ["string", "null"]
          description: Shadow leader current prediction (P, B, or null)
        shadowLeaderComposite:
          type: number
          description: Shadow leader composite score
        lockAccelerated:
          type: boolean
          description: True when lock was broken early this hand by streak analysis
        shadowPromoted:
          type: boolean
          description: True when shadow leader was promoted to dominant this hand

    ObserverSubSystem:
      type: object
      required: [winRate, total, lastPred]
      properties:
        winRate:
          type: number
          description: Rolling 10-hand win rate (0-1)
        total:
          type: integer
          description: Total predictions evaluated
        lastPred:
          type: ["string", "null"]
          description: '"P", "B", or null'

    ObserverMemory:
      type: object
      required: [meta, lookAhead, derived]
      properties:
        meta:
          $ref: "#/components/schemas/ObserverSubSystem"
        lookAhead:
          $ref: "#/components/schemas/ObserverSubSystem"
        derived:
          $ref: "#/components/schemas/ObserverSubSystem"

    CrisisAIResult:
      type: object
      required: [active, prediction, confidence, reasoning, consecutiveLosses]
      properties:
        active:
          type: boolean
          description: True when the crisis AI is actively overriding (2+ consecutive losses)
        prediction:
          type: ["string", "null"]
          description: '"P", "B", or null'
        confidence:
          type: string
          description: '"LOW" | "MED" | "HIGH"'
        reasoning:
          type: string
          description: One-sentence AI explanation for the prediction
        consecutiveLosses:
          type: integer
          description: Current streak of consecutive main prediction losses

    GameSnapshot:
      type: object
      required: [handCount, history, regime, lookAhead, legacyLookAhead, metaAI, observer, observerMemory, crisisAI]
      properties:
        handCount:
          type: integer
        history:
          type: array
          items:
            type: string
          description: Array of B, P, T outcomes entered so far
        regime:
          $ref: "#/components/schemas/RegimeState"
        lookAhead:
          $ref: "#/components/schemas/LookAheadResult"
        legacyLookAhead:
          $ref: "#/components/schemas/LookAheadResult"
        metaAI:
          $ref: "#/components/schemas/MetaAIResult"
        observer:
          $ref: "#/components/schemas/ObserverResult"
        observerMemory:
          $ref: "#/components/schemas/ObserverMemory"
          description: Per-sub-system win rates tracked by ObserverMasterAI
        crisisAI:
          $ref: "#/components/schemas/CrisisAIResult"
          description: Gemini AI recovery engine — activates after 2 consecutive main losses

    LookAheadResult:
      type: object
      required: [active, verdict, bias, strength, recentAcc, avgP, avgB]
      properties:
        active:
          type: boolean
        verdict:
          type: ["string", "null"]
          description: '"P", "B", or null'
        bias:
          type: number
        strength:
          type: number
        recentAcc:
          type: ["number", "null"]
          description: Rolling accuracy (0-1) or null if no predictions yet
        avgP:
          type: number
        avgB:
          type: number

    MetaAIResult:
      type: object
      required: [decision, pPlayer, accuracy, seen]
      properties:
        decision:
          type: string
          description: '"P", "B", or "WAIT"'
        pPlayer:
          type: number
          description: Probability of Player (0-1)
        accuracy:
          type: ["number", "null"]
          description: Rolling accuracy (0-1) or null if fewer than 1 prediction
        seen:
          type: integer
          description: Total labeled hands seen by MetaAI

    ObserverResult:
      type: object
      required: [decision, wr, reasoning, isFallback]
      properties:
        decision:
          type: string
          description: '"P", "B", or "WAIT"'
        wr:
          type: ["number", "null"]
          description: Win-rate of the winning sub-system, or null for fallback
        reasoning:
          type: string
        isFallback:
          type: boolean

    # ── Admin schemas ───────────────────────────────────────
    UserAccount:
      type: object
      required: [id, username, expiresAt, createdAt, isOnline, lastLoginAt]
      properties:
        id:
          type: integer
        username:
          type: string
        expiresAt:
          type: string
          description: ISO 8601 datetime
        createdAt:
          type: string
          description: ISO 8601 datetime
        isOnline:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
          description: ISO 8601 datetime or null

    UserAccountInput:
      type: object
      required: [username, password, expiresAt]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
        expiresAt:
          type: string
          description: ISO 8601 datetime

    UserAccountUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
        expiresAt:
          type: string
          description: ISO 8601 datetime
